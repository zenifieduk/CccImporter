<!DOCTYPE html>
<html>
<head>
    <title>Calendar Test</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <h1>Calendar Download Test</h1>
    
    <div x-data="testCalendar()">
        <button @click="downloadIcs()" style="padding: 10px 20px; background: #007AFF; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Download Test .ics File
        </button>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('testCalendar', () => ({
                downloadIcs() {
                    const now = new Date();
                    const startDate = new Date(now.getTime() + (24 * 60 * 60 * 1000)); // Tomorrow
                    const endDate = new Date(startDate.getTime() + (3 * 60 * 60 * 1000)); // 3 hours later
                    
                    const formatDate = (date) => {
                        return date.getFullYear().toString() +
                               (date.getMonth() + 1).toString().padStart(2, '0') +
                               date.getDate().toString().padStart(2, '0') + 'T' +
                               date.getHours().toString().padStart(2, '0') +
                               date.getMinutes().toString().padStart(2, '0') +
                               date.getSeconds().toString().padStart(2, '0') + 'Z';
                    };
                    
                    const icsContent = [
                        'BEGIN:VCALENDAR',
                        'VERSION:2.0',
                        'PRODID:-//Classic Car Clubs UK//Auction Calendar//EN',
                        'CALSCALE:GREGORIAN',
                        'METHOD:PUBLISH',
                        'BEGIN:VEVENT',
                        `UID:test-auction@classiccarclubs.uk`,
                        `DTSTART:${formatDate(startDate)}`,
                        `DTEND:${formatDate(endDate)}`,
                        `DTSTAMP:${formatDate(now)}`,
                        `CREATED:${formatDate(now)}`,
                        `LAST-MODIFIED:${formatDate(now)}`,
                        'SEQUENCE:0',
                        'SUMMARY:Test Classic Car Auction',
                        'DESCRIPTION:Test auction event for calendar functionality',
                        'LOCATION:Test Location, UK',
                        'STATUS:CONFIRMED',
                        'TRANSP:OPAQUE',
                        'CLASS:PUBLIC',
                        'CATEGORIES:AUCTION,CLASSIC CARS,AUTOMOTIVE',
                        'URL:https://classiccarclubs.uk',
                        'END:VEVENT',
                        'END:VCALENDAR'
                    ].join('\r\n');
                    
                    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'test-auction.ics';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                    
                    alert('ICS file downloaded! Check your downloads folder.');
                }
            }));
        });
    </script>
</body>
</html>
